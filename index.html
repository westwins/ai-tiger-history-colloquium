    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    html, body {

      background-color: #04070f;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Malgun Gothic", sans-serif;
    }
    #stage {
      position: relative;
      width: 100vw; height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: radial-gradient(circle at 35% 50%, #0d1b38 0%, #04070f 75%);
    }

      box-shadow: 0 0 80px rgba(0, 195, 255, 0.18), 0 0 140px rgba(245, 158, 11, 0.12);
      cursor: pointer;
    }
    #hud {

      display: flex; gap: 8px; align-items: center;
      background: rgba(7, 11, 20, 0.78);
      border: 1px solid rgba(56, 189, 248, 0.3);
      backdrop-filter: blur(8px);
      padding: 8px 14px; border-radius: 999px;
      color: #e2e8f0; font-size: 12px;
      opacity: 0.2; transition: opacity 0.3s ease; z-index: 20;
    }
    #hud:hover { opacity: 1; }
    .btn {
      background: rgba(30, 41, 59, 0.9); color: #f8fafc;
      border: 1px solid rgba(148, 163, 184, 0.3);
      padding: 5px 11px; border-radius: 999px;
      font-size: 11px; font-weight: 600; cursor: pointer;
    }
    .btn:hover { border-color: #38bdf8; color: #38bdf8; }
    .legend-dot {
      display: inline-block; width: 8px; height: 8px;
      border-radius: 50%; margin-right: 5px;
    }

    const canvas = document.getElementById('posterCanvas');
    const ctx = canvas.getContext('2d');
    const W = 896, H = 1200;

    const baseCanvas = document.createElement('canvas');
    baseCanvas.width = W; baseCanvas.height = H;
    const baseCtx = baseCanvas.getContext('2d');

    let blueWirePixels = [];
    let orangeWirePixels = [];
    let imageLoaded = false;

    const BLUE_PATHS = [
      [[296, 562], [395, 515], [510, 445], [658, 384]],
      [[383, 765], [495, 775], [615, 785], [744, 792]],
      [[367, 587], [465, 550], [560, 505], [658, 460]],
      [[369, 362], [410, 290], [455, 210], [522, 139]],
      [[370, 390], [430, 335], [495, 275], [574, 229]],
      [[366, 341], [415, 275], [470, 215], [532, 162]],
      [[446, 849], [530, 838], [620, 822], [706, 805]],
      [[346, 542], [415, 532], [485, 520], [548, 507]],
      [[330, 369], [385, 325], [435, 278], [491, 232]],
      [[470, 588], [520, 535], [570, 480], [622, 427]],
      [[365, 357], [382, 280], [402, 205], [425, 132]],
      [[175, 420], [245, 418], [320, 422], [395, 430]],
      [[135, 415], [210, 455], [295, 485], [380, 495]],
      [[145, 715], [225, 745], [315, 795], [445, 845]]
    ];

    const ORANGE_PATHS = [
      [[520, 828], [440, 755], [365, 675], [296, 593]],
      [[375, 801], [310, 730], [250, 655], [197, 583]],
      [[582, 753], [510, 728], [445, 702], [384, 674]],
      [[402, 907], [350, 845], [302, 780], [259, 717]],
      [[509, 868], [460, 825], [412, 782], [366, 738]],
      [[590, 765], [525, 756], [462, 746], [403, 736]],
      [[715, 979], [682, 930], [650, 882], [620, 834]],
      [[532, 245], [490, 282], [450, 318], [413, 351]],
      [[645, 635], [520, 625], [395, 605], [265, 585]],
      [[680, 895], [545, 875], [415, 835], [275, 765]],
      [[385, 455], [305, 450], [225, 445], [145, 440]],
      [[245, 825], [208, 780], [178, 745], [150, 715]]
    ];

    function getCubicPoint(p0, p1, p2, p3, t) {
      const u = 1 - t, tt = t * t, uu = u * u, uuu = uu * u, ttt = tt * t;
      return [
        uuu * p0[0] + 3 * uu * t * p1[0] + 3 * u * tt * p2[0] + ttt * p3[0],
        uuu * p0[1] + 3 * uu * t * p1[1] + 3 * u * tt * p2[1] + ttt * p3[1]
      ];
    }

    const comets = [];
    BLUE_PATHS.forEach((pts, idx) => {
      comets.push({ type: 'blue', pts, t: (idx * 0.17) % 1, speed: 0.0042 + (idx % 4) * 0.0008, size: 3.5 + (idx % 3) * 0.8 });
      comets.push({ type: 'blue', pts, t: ((idx * 0.17) + 0.5) % 1, speed: 0.0042 + (idx % 4) * 0.0008, size: 2.8 });
    });
    ORANGE_PATHS.forEach((pts, idx) => {
      comets.push({ type: 'orange', pts, t: (idx * 0.23) % 1, speed: 0.0036 + (idx % 4) * 0.0007, size: 3.5 + (idx % 2) * 0.9 });
      comets.push({ type: 'orange', pts, t: ((idx * 0.23) + 0.5) % 1, speed: 0.0036 + (idx % 4) * 0.0007, size: 2.6 });
    });

    function analyzeWirePixels() {
      blueWirePixels = [];
      orangeWirePixels = [];
      const imgData = baseCtx.getImageData(0, 0, W, H).data;
      for (let y = 90; y < 1080; y += 2) {
        for (let x = 25; x < 860; x += 2) {
          const i = (y * W + x) * 4;
          const r = imgData[i], g = imgData[i + 1], b = imgData[i + 2];
          if (r > 185 && g > 185 && b > 185) continue;
          if (b > 145 && g > 115 && (b - r) > 55 && x < 760) {
            const dist = Math.hypot(x - 190, y - 480);
            blueWirePixels.push({ x, y, dist, intensity: Math.min(1, (b - r) / 140) });
          } else if (
            r > 205 && g > 95 && g < 215 && b < 115 && (r - b) > 105 &&
            ((x > 65 && x < 410 && y > 360 && y < 860) || (x >= 210 && x < 720 && y > 130 && y < 1010))
          ) {
            const dist = Math.hypot(x - 165, y - 640);
            orangeWirePixels.push({ x, y, dist, intensity: Math.min(1, (r - b) / 160) });
          }
        }
      }
    }

    const img = new Image();
    img.onload = () => {
      baseCtx.drawImage(img, 0, 0, W, H);
      analyzeWirePixels();
      imageLoaded = true;
    };
    img.src = EMBEDDED_POSTER;

    let time = 0;
    function render() {
      requestAnimationFrame(render);
      if (!imageLoaded) return;
      time += 0.045;

      ctx.globalCompositeOperation = 'source-over';
      ctx.drawImage(baseCanvas, 0, 0, W, H);
      ctx.globalCompositeOperation = 'lighter';

      for (let i = 0; i < blueWirePixels.length; i++) {
        const p = blueWirePixels[i];
        const wave = Math.sin(p.dist * 0.032 - time * 2.2);
        if (wave > 0.35) {
          ctx.fillStyle = `rgba(34, 211, 238, ${(wave - 0.35) * 0.55 * p.intensity})`;
          ctx.fillRect(p.x - 1, p.y - 1, 3, 3);
        }
      }

      for (let i = 0; i < orangeWirePixels.length; i++) {
        const p = orangeWirePixels[i];
        const wave = Math.sin(p.dist * 0.032 + time * 1.9);
        if (wave > 0.4) {
          ctx.fillStyle = `rgba(251, 146, 60, ${(wave - 0.4) * 0.55 * p.intensity})`;
          ctx.fillRect(p.x - 1, p.y - 1, 3, 3);
        }
      }

      comets.forEach((c) => {
        c.t = (c.t + c.speed) % 1;
        const [p0, p1, p2, p3] = c.pts;
        for (let s = 0; s < 10; s++) {
          const tailT = c.t - s * 0.014;
          if (tailT < 0) continue;
          const [tx, ty] = getCubicPoint(p0, p1, p2, p3, tailT);
          const ratio = (10 - s) / 10;
          ctx.fillStyle = c.type === 'blue'
            ? (s === 0 ? '#e0f2fe' : `rgba(34, 211, 238, ${ratio * 0.55})`)
            : (s === 0 ? '#fef3c7' : `rgba(249, 115, 22, ${ratio * 0.55})`);
          ctx.beginPath();
          ctx.arc(tx, ty, c.size * ratio, 0, Math.PI * 2);
          ctx.fill();
        }
        const [hx, hy] = getCubicPoint(p0, p1, p2, p3, c.t);
        const grad = ctx.createRadialGradient(hx, hy, 0, hx, hy, c.size * 5);
        if (c.type === 'blue') {
          grad.addColorStop(0, 'rgba(56, 189, 248, 0.75)');
          grad.addColorStop(0.4, 'rgba(34, 211, 238, 0.25)');
          grad.addColorStop(1, 'rgba(34, 211, 238, 0)');
        } else {
          grad.addColorStop(0, 'rgba(251, 191, 36, 0.8)');
          grad.addColorStop(0.4, 'rgba(249, 115, 22, 0.28)');
          grad.addColorStop(1, 'rgba(249, 115, 22, 0)');
        }
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(hx, hy, c.size * 5, 0, Math.PI * 2);
        ctx.fill();
      });

      const pulse = 0.5 + 0.5 * Math.sin(time * 1.8);
      [
        { x: 147, y: 718, r: 48, color: `rgba(249, 115, 22, ${0.18 + pulse * 0.22})` },
        { x: 122, y: 418, r: 34, color: `rgba(34, 211, 238, ${0.18 + pulse * 0.25})` },
        { x: 280, y: 425, r: 42, color: `rgba(56, 189, 248, ${0.14 + pulse * 0.20})` }
      ].forEach((core) => {
        const g = ctx.createRadialGradient(core.x, core.y, 2, core.x, core.y, core.r);
        g.addColorStop(0, core.color);
        g.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(core.x, core.y, core.r, 0, Math.PI * 2);
        ctx.fill();
      });
    }
    requestAnimationFrame(render);

    function toggleFullscreen() {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
      else document.exitFullscreen();
    }
  </script>
</body>
</html>
